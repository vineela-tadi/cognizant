spring.application.name=api-gateway
server.port=9090

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.server.webmvc.routes[0].id=account
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://ACCOUNT
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/account/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[1].id=loan
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://LOAN
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/loan/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1